# Managed policy for isolated, native Forky builds. No per-repository hooks.
$chroot_mode = 'unshare';
$distribution = 'forky';
$enable_network = 0;
$purge_build_directory = 'always';
$unshare_tmpdir_template = '/var/tmp/gitbuild-sbuild.XXXXXXXXXX';
$unshare_mmdebstrap_auto_create = 0;
$unshare_mmdebstrap_max_age = -1;
$unshare_bind_mounts = [];
$run_lintian = 1;
$run_autopkgtest = 0;
$run_piuparts = 0;
1;
