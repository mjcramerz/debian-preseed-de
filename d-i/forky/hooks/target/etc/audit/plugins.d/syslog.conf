## Managed by installer late_command.
## Disabled intentionally: audisp-syslog writes to /dev/log, which would send
## every audit event through systemd-journald before rsyslog. The managed
## rsyslog imfile input tails /var/log/audit/audit.log directly instead.
active = no
direction = out
path = /usr/sbin/audisp-syslog
type = always
args = LOG_INFO LOG_LOCAL0
format = string
