#
# Managed by installer late_command.
#
# auditd is the authoritative audit-netlink consumer and writes the complete
# event stream here. Rsyslog tails log_file directly through imfile; audit
# dispatcher plugins must not send the same records through /dev/log because
# that path is owned by systemd-journald.
#
local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = adm
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 100
max_log_file = 16
num_logs = 4
priority_boost = 4
name_format = HOSTNAME
distribute_network = no
max_log_file_action = ROTATE
space_left = 25%
space_left_action = SYSLOG
admin_space_left = 10%
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND
q_depth = 8192
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
