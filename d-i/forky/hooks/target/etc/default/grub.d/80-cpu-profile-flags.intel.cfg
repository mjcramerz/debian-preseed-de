# Active Intel powersave is an Intel algorithm, not generic CPUFreq powersave.
# CPUFreq setpolicy parses this boot policy directly; passive mode uses schedutil.
# Explicit CPU policy for every managed boot profile. Default and Hardened use
# translated DMA with strict invalidation; Performance retains the deployed
# passthrough/lazy-invalidation tradeoff. The VFIO device still uses its IOMMU.
GRUB_PROFILE_DEFAULT_FLAGS="${GRUB_PROFILE_DEFAULT_FLAGS:+$GRUB_PROFILE_DEFAULT_FLAGS }intel_pstate=active intel_iommu=on iommu.passthrough=0 iommu.strict=1 cpufreq.default_governor=powersave"
GRUB_PROFILE_HARDENED_FLAGS="${GRUB_PROFILE_HARDENED_FLAGS:+$GRUB_PROFILE_HARDENED_FLAGS }intel_pstate=passive intel_iommu=on iommu.passthrough=0 iommu.strict=1 cpufreq.default_governor=schedutil"
GRUB_PROFILE_PERFORMANCE_FLAGS="${GRUB_PROFILE_PERFORMANCE_FLAGS:+$GRUB_PROFILE_PERFORMANCE_FLAGS }intel_pstate=active intel_iommu=on iommu=pt iommu.strict=0 cpufreq.default_governor=powersave"
