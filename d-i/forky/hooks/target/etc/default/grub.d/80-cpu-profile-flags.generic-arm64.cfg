# Architecture-neutral IOMMU policy. No x86 pstate or vendor IOMMU parameters.
GRUB_PROFILE_DEFAULT_FLAGS="${GRUB_PROFILE_DEFAULT_FLAGS:+$GRUB_PROFILE_DEFAULT_FLAGS }iommu.passthrough=0 cpufreq.default_governor=schedutil"
GRUB_PROFILE_HARDENED_FLAGS="${GRUB_PROFILE_HARDENED_FLAGS:+$GRUB_PROFILE_HARDENED_FLAGS }iommu.passthrough=0 iommu.strict=1 cpufreq.default_governor=powersave"
GRUB_PROFILE_PERFORMANCE_FLAGS="${GRUB_PROFILE_PERFORMANCE_FLAGS:+$GRUB_PROFILE_PERFORMANCE_FLAGS }iommu.passthrough=0 cpufreq.default_governor=performance"
