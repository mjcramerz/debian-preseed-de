# KMS/fbdev for Wayland plus the deployed PCI BAR reallocation policy.
# Read by both stock GRUB configuration and the managed profile generator.
GRUB_PROFILE_DEFAULT_FLAGS="${GRUB_PROFILE_DEFAULT_FLAGS:+$GRUB_PROFILE_DEFAULT_FLAGS }nvidia-drm.modeset=1 nvidia-drm.fbdev=1 pci=realloc=on"
GRUB_PROFILE_HARDENED_FLAGS="${GRUB_PROFILE_HARDENED_FLAGS:+$GRUB_PROFILE_HARDENED_FLAGS }nvidia-drm.modeset=1 nvidia-drm.fbdev=1 pci=realloc=on"
GRUB_PROFILE_PERFORMANCE_FLAGS="${GRUB_PROFILE_PERFORMANCE_FLAGS:+$GRUB_PROFILE_PERFORMANCE_FLAGS }nvidia-drm.modeset=1 nvidia-drm.fbdev=1 pci=realloc=on"
