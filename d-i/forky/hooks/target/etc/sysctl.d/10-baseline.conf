# /etc/sysctl.d/10-baseline.conf (shared)
kernel.sched_autogroup_enabled   = 1
kernel.sysrq                     = 500
kernel.panic_on_warn             = 0
kernel.panic_on_oops             = 0
kernel.randomize_va_space        = 2
kernel.kexec_load_disabled       = 1
kernel.kptr_restrict             = 2
kernel.dmesg_restrict            = 1
kernel.yama.ptrace_scope         = 1
kernel.perf_event_paranoid       = 2
kernel.unprivileged_bpf_disabled = 1

vm.swappiness               = 10
vm.defrag_mode              = 1
vm.vfs_cache_pressure       = 75
vm.vfs_cache_pressure_denom = 100
# Ratio fallbacks for early boot and recovery; the storage layer later pins
# the live writeback ceiling with byte-based limits.
vm.dirty_background_ratio   = 4
vm.dirty_ratio              = 8
vm.dirty_expire_centisecs   = 3000
vm.dirty_writeback_centisecs = 500
vm.overcommit_memory        = 1
vm.nr_hugepages             = 0
vm.max_map_count            = 262144
vm.mmap_min_addr            = 65536
vm.mmap_rnd_bits            = 32
vm.mmap_rnd_compat_bits     = 16
vm.unprivileged_userfaultfd = 0

fs.suid_dumpable            = 0
fs.protected_hardlinks      = 1
fs.protected_symlinks       = 1
fs.protected_fifos          = 2
fs.protected_regular        = 2

dev.tty.ldisc_autoload      = 0
dev.tty.legacy_tiocsti      = 0

kernel.unprivileged_userns_clone = 1
user.max_user_namespaces    = 16384

net.core.default_qdisc       = fq
net.core.bpf_jit_harden      = 2
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen        = 3
net.ipv4.tcp_slow_start_after_idle = 0

net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.rmem_max     = 134217728
net.core.wmem_max     = 134217728
net.ipv4.tcp_rmem     = 4096 87380 134217728
net.ipv4.tcp_wmem     = 4096 65536 134217728

net.core.netdev_max_backlog = 250000
net.core.somaxconn          = 32768
net.ipv4.tcp_max_syn_backlog = 16384

net.ipv4.conf.all.rp_filter      = 1
net.ipv4.conf.default.rp_filter  = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.ip_unprivileged_port_start = 1025

net.ipv4.tcp_keepalive_time   = 600
net.ipv4.tcp_keepalive_intvl  = 15
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_fin_timeout      = 30
net.ipv4.tcp_tw_reuse         = 1
