# Managed global logrotate defaults.
#
# Package and repository-specific policies live in /etc/logrotate.d. Local
# stanzas may override these defaults when a service has stricter requirements.
# Only package-native file writers are checked by the daily vendor timer.
# Collector files use the native omfile 2 MiB callback, not logrotate. Native
# size conditions are checked when logrotate runs; they are not hard quotas.
# Seconds in archive names also allow explicit administrator-triggered runs.
# Journal, native audit/ClamAV rotation, and rsyslog queue budgets are separate.

daily
rotate 4
maxage 7
create
dateext
dateformat -%Y%m%d-%H%M%S
compress
delaycompress
missingok
notifempty

include /etc/logrotate.d
