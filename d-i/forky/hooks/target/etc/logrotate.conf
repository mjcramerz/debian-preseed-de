# Managed global logrotate defaults.
#
# Package and repository-specific policies live in /etc/logrotate.d. Local
# stanzas may override these defaults when a service has stricter requirements.
# The managed logrotate.timer checks every 15 minutes, so archive names include
# seconds to prevent same-day size-triggered rotations from colliding.
# Managed rotation thresholds are not hard quotas: a busy source can exceed
# maxsize between timer runs. Journal and queue limits are separate budgets.

daily
rotate 4
maxage 7
create
dateext
dateformat -%Y%m%d-%H%M%S
compress
delaycompress
missingok
notifempty

include /etc/logrotate.d
