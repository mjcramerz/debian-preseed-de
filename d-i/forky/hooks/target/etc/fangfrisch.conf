[DEFAULT]
cleanup = automatic
db_url = sqlite:////var/lib/fangfrisch/db.sqlite
integrity_check = sha256
local_directory = /var/lib/clamav
log_level = INFO
log_method = console
log_format = %(levelname)s: %(message)s
max_size = 40MB
on_update_exec = /bin/true
on_update_timeout = 5

[sanesecurity]
enabled = yes
prefix = https://mirror.seichter.de/sanesecurity/

[urlhaus]
# Enabled privately by the installer only when PRESEED_URLHAUS_AUTHKEY is set.
enabled = no
auth_key =
interval = 10m
url_urlhaus = https://urlhaus-api.abuse.ch/v2/files/exports/${auth_key}/urlhaus_clamav.ndb
filename_urlhaus = urlhaus_clamav.ndb
max_size = 40MB
