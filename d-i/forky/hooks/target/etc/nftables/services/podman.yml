apiVersion: cybops.nftables/v1
kind: NftablesServiceOverlay
metadata:
  name: podman
  description: Rootless Podman uses pasta; no host bridge forwarding exception.
  merge_priority: 50
containers:
  podman:
    # Netavark bridges live inside the rootless namespace, not on the host.
    # Published ports remain subject to the normal host firewall policy.
    enabled: false
    allow_container_outbound: false
    interfaces: []
