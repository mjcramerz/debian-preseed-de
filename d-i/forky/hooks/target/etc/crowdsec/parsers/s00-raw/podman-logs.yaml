# Podman's managed k8s-file driver is not Docker JSON. Keep labels explicit:
# each acquisition must name the application parser, e.g. program: nginx.
name: local/podman-logs
description: Decode complete Podman CRI log records for an explicit application
filter: "evt.Line.Labels.type == 'podman' and 'program' in evt.Line.Labels"
onsuccess: next_stage
grok:
  pattern: '^%{TIMESTAMP_ISO8601:timestamp} (stdout|stderr) F %{GREEDYDATA:message}$'
  apply_on: Line.Raw
statics:
  - target: evt.StrTime
    expression: evt.Parsed.timestamp
  - parsed: program
    expression: evt.Line.Labels.program
