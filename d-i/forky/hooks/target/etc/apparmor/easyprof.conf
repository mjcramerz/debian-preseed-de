# Managed AppArmor easyprof configuration.
#
# aa-easyprof's configuration parser recognizes exactly the two directory
# settings below. Keep both pointed at the apparmor-utils package-managed
# templates and policy groups so package upgrades can provide compatible
# additions. Template selection, policy groups, parser paths, include paths,
# manifests, output directories, vendor/version selection, and custom include
# directories are per-invocation aa-easyprof options rather than configuration
# file keys.
#
# Both directories must exist or aa-easyprof will fail closed before generating
# policy.

# Location of system policy groups.
POLICYGROUPS_DIR="/usr/share/apparmor/easyprof/policygroups"

# Location of system templates.
TEMPLATES_DIR="/usr/share/apparmor/easyprof/templates"
