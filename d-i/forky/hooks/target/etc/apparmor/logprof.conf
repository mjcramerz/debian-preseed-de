#
# Managed AppArmor profiling defaults. The dedicated rsyslog destination is
# first so aa-logprof and aa-genprof use the complete AppArmor event stream
# without scanning unrelated system messages.

[settings]
  profiledir = /etc/apparmor.d /etc/subdomain.d
  inactive_profiledir = /usr/share/apparmor/extra-profiles
  logfiles = /var/log/managed/apparmor/apparmor.log /var/log/managed/audit/kernel-audit.log /var/log/audit/audit.log /var/log/syslog /var/log/kern.log /var/log/messages

  parser = /usr/sbin/apparmor_parser /sbin/apparmor_parser /sbin/subdomain_parser
  logger = /usr/bin/logger /bin/logger

  # Customize how file ownership permissions are presented:
  # 0 - off
  # 1 - default to the mode reported by the log
  # 2 - force new permissions to owner rules
  # 3 - force every permission on the rule to be an owner rule
  default_owner_prompt = 1

  # Relative directories below /etc/apparmor.d that may provide #include
  # candidates. Keep empty unless a repository-managed include catalog is
  # deliberately added.
  custom_includes =

  # When called with --json, write input/output diagnostics to
  # /tmp/aa-jsonlog-*. Leave disabled outside explicit debugging sessions.
  json_log = 0

[qualifiers]
  # Shells and AppArmor profiling/policy-management tools must not be suggested
  # for separate child confinement.
  /bin/bash                 = icnu
  /usr/bin/bash             = icnu
  /bin/ksh                  = icnu
  /usr/bin/ksh              = icnu
  /bin/dash                 = icnu
  /usr/bin/dash             = icnu
  /bin/zsh                  = icnu
  /usr/bin/zsh              = icnu
  /usr/bin/aa-easyprof      = u
  /usr/sbin/aa-audit        = u
  /usr/sbin/aa-autodep      = u
  /usr/sbin/aa-cleanprof    = u
  /usr/sbin/aa-complain     = u
  /usr/sbin/aa-decode       = u
  /usr/sbin/aa-disable      = u
  /usr/sbin/aa-enforce      = u
  /usr/sbin/aa-genprof      = u
  /usr/sbin/aa-load         = u
  /usr/sbin/aa-logprof      = u
  /usr/sbin/aa-mergeprof    = u
  /usr/sbin/aa-remove-unknown = u
  /usr/sbin/aa-status       = u
  /usr/sbin/aa-teardown     = u
  /usr/sbin/aa-unconfined   = u
  /usr/sbin/aa-update-browser = u
  /usr/bin/aa-notify        = u
  /usr/sbin/apparmor_parser = u

  # These programs cannot function usefully if confined by a generated child
  # profile.
  /bin/mount                         = u
  /usr/bin/mount                     = u
  /etc/init.d/subdomain              = u
  /sbin/cardmgr                      = u
  /usr/sbin/cardmgr                  = u
  /sbin/subdomain_parser             = u
  /usr/sbin/subdomain_parser         = u
  /usr/sbin/genprof                  = u
  /usr/sbin/logprof                  = u
  /usr/lib/YaST2/servers_non_y2/ag_genprof = u
  /usr/lib/YaST2/servers_non_y2/ag_logprof = u

  # Common helper programs should inherit the parent profile instead of
  # receiving standalone profiles.
  /bin/awk          = icn
  /usr/bin/awk      = icn
  /bin/cat          = icn
  /usr/bin/cat      = icn
  /bin/chmod        = icn
  /usr/bin/chmod    = icn
