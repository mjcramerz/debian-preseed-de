# Managed by installer late_command.
# Keep AppArmor include resolution explicit for both managed local policy and
# the shipped abstraction/include trees.
Include /etc/apparmor.d/
Include /usr/share/apparmor

# Keep compiled policy caches enabled so boot-time loads and package-trigger
# reloads stay fast and deterministic on managed hosts.
write-cache
cache-loc=/var/cache/apparmor
Optimize=rule-merge
Optimize=compress-fast

# Use the unversioned feature set owned and upgraded by Debian's apparmor
# package instead of overwriting it with an installer-pinned snapshot.
# Kernel and LSM activation are boot-policy responsibilities; this parser
# configuration and the mode reconciler intentionally perform no runtime
# kernel, command-line, or LSM feature gating.
policy-features=/usr/share/apparmor-features/features
