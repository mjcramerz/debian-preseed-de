# Managed Recoll index baseline. Users may override any value through the
# Recoll index configuration dialog or by editing this file.

# Index the complete home directory while excluding transient, generated,
# remote, and credential-bearing locations below.
topdirs = ~
skippedNames+ = .git .svn .hg .bzr .jj .pijul _darcs \
    .fossil-settings CVS node_modules .venv venv .mypy_cache .ruff_cache \
    .coverage .terraform .gradle .m2 .npm .pnpm-store \
    target build dist out .next .nuxt .svelte-kit
noContentSuffixes+ = .iso .qcow .qcow2 .vmdk .vdi .ova .ovf \
    .squashfs .snap .AppImage .deb .rpm .apk
skippedPaths = /media /mnt /run/user/*/gvfs \
    ~/.cache ~/.local/share/Trash ~/.local/share/keyrings \
    ~/.aws ~/.azure ~/.docker ~/.gnupg ~/.kube ~/.ssh \
    ~/.password-store ~/.pki ~/.netrc ~/.git-credentials \
    ~/.config/containers ~/.config/gcloud ~/.config/gh \
    ~/.local/share/containers \
    ~/.config/chromium ~/.config/google-chrome \
    ~/.config/BraveSoftware ~/.config/opera ~/.mozilla \
    ~/.config/microsoft-edge ~/.config/vivaldi \
    ~/.config/keepassxc ~/.config/tutanota-desktop \
    ~/Syncthing/keepassxc
nowalkfn = .recoll-noindex
followLinks = 0

# Bound expensive extraction while retaining filename search for unsupported
# or intentionally skipped content.
compressedfilemaxkbs = 100000
membermaxkbs = 50000
textfilemaxmbs = 32
textfilepagekbs = 1024
textunknownasplain = 0
indexallfilenames = 1
usesystemfilecommand = 1
processwebqueue = 0
nomd5types = rclaudio.py audio/* video/*

# OCR image-only PDFs with the installed English and Swedish Tesseract
# language data. The filter timeout below bounds pathological documents.
pdfocr = 1
pdfforceocr = 0
ocrprogs = tesseract
tesseractlang = eng+swe
ocrcachedir = ~/.cache/recoll/ocrcache

# Preserve useful snippets and multilingual stemming without enabling
# case-sensitive or diacritic-sensitive index storage.
indexStripChars = 1
indexStoreDocText = 1
indexstemminglanguages = english swedish
defaultcharset = UTF-8
testmodifusemtime = 0
noxattrfields = 0

# Keep rebuildable data under the XDG cache tree and stop before a nearly
# full filesystem becomes unusable.
cachedir = ~/.cache/recoll
dbdir = xapiandb
maxfsoccuppc = 90

# Let Recoll size its worker queues to the machine while bounding individual
# filters and reducing background work on battery-powered systems.
idxflushmb = 64
filtermaxseconds = 300
filtermaxmbytes = 5000
thrQSizes = 0
suspendonbattery = 1

# Keep separate, timestamped logs for interactive, batch, and monitor modes.
loglevel = 2
logfilename = ~/.recoll/recoll.log
logthedate = 1
idxloglevel = 2
idxlogfilename = ~/.recoll/index.log
idxlogthedate = 1
daemloglevel = 2
daemlogfilename = ~/.recoll/monitor.log
daemlogthedate = 1

# Coalesce real-time events and delay files which commonly change in bursts.
monixinterval = 30
monauxinterval = 3600
mondelaypatterns = *.log:120 *.tmp:60 *.part:60

# Bound query expansion and snippet walks to avoid pathological searches.
autodiacsens = 0
autocasesens = 0
maxTermExpand = 10000
maxXapianClauses = 50000
snippetMaxPosWalk = 1000000
