# Managed by unattended-installer.
# Keep the Qt/LXQt chooser compact and keyboard-friendly on Labwc.
[Sizes]
SplitterPos=200
WindowSize=@Size(700 500)

[View]
BigIconSize=48
Mode=Detailed
SmallIconSize=24
SortColumn=name
SortFolderFirst=true
SortOrder=descending
SortHiddenLast=true
SortCaseSensitive=false
ShowHidden=false
ShowThumbnails=true
NoItemTooltip=false
ScrollPerPixel=true
ThumbnailIconSize=128
# Empty lists keep every column and standard place visible.  QSettings reads
# these as empty QVariant lists and rewrites them when the user customizes the
# chooser.
HiddenColumns=

[Places]
HiddenPlaces=
