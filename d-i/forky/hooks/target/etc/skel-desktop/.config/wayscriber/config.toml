# Environment-only controls deliberately stay outside TOML: WAYSCRIBER_NO_TRAY,
# WAYSCRIBER_TRAY_FORCE_PIXMAP, WAYSCRIBER_FORCE_INLINE_TOOLBARS,
# WAYSCRIBER_DISABLE_UPDATE_CHECK, debug variables
# and RUST_LOG. WAYSCRIBER_TOOLBAR_BACKEND overrides ui.toolbar.backend.
# Change the existing service drop-ins for environment overrides.
