# Managed by unattended-installer.
# Applications can move their main PID to an app- prefixed scope.
# Bind that scope to the same session as the managed launcher service.
[Unit]
Requisite=labwc-session.target
After=labwc-session.target
PartOf=labwc-session.target

[Scope]
KillMode=control-group
TimeoutStopSec=20s
SendSIGKILL=yes
