# Managed by unattended-installer.
#
# Use UCM profiles whenever the ALSA card provides them. Do not restore a
# previously selected route or default target at login: the managed login gate
# selects the internal capture source and mutes it before Labwc starts. Fresh
# device routes start capture at 80 percent, while ACP keeps every ALSA node at
# or below 120 percent to prevent unsafe amplification.
monitor.alsa.properties = {
  alsa.use-ucm = true
}

wireplumber.settings = {
  device.restore-routes = false
  device.routes.default-source-volume = 0.8
  node.restore-default-targets = false
}

monitor.alsa.rules = [
  {
    # HDMI and DisplayPort codecs must never produce selectable capture or
    # playback nodes on managed desktops. Match both stable node names and
    # hardware-facing descriptions because ALSA/UCM naming varies by device.
    matches = [
      {
        node.name = "~.*[Hh][Dd][Mm][Ii].*"
      }
      {
        node.name = "~.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][._ -]?[Pp][Oo][Rr][Tt].*"
      }
      {
        node.description = "~.*[Hh][Dd][Mm][Ii].*"
      }
      {
        node.description = "~.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][._ -]?[Pp][Oo][Rr][Tt].*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.acp.max-volume = 1.2
      }
    }
  }
]
