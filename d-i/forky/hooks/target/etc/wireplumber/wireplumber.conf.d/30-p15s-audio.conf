# Installed only for the P15s profiles. Prefer the internal speakers at login;
# never restore a previously selected headphones profile or default target.
wireplumber.settings = {
  device.restore-profile = false
}
# The login helper selects speakers once. This native policy also covers later
# EnumProfile/availability changes, using real profile names rather than a
# single guessed UCM device combination. It creates no service or poller.
wireplumber.components = [
  { name = "p15s-speaker-profile.lua" type = "script/lua"
    provides = "hooks.device.p15s-speaker-profile" }
]
wireplumber.profiles = {
  main = { hooks.device.p15s-speaker-profile = required }
}
# Keep the shared HDMI and capture policy from 20-audio-policy.conf intact.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = { priority.session = 1300 }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = { priority.session = 1200 }
    }
  }
]
