# Installed only for the P15s profiles. Let UCM route availability select
# speakers with no jack, headphones with a jack; never restore an old profile.
wireplumber.settings = {
  device.restore-profile = false
}
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~.*[Hh][Dd][Mm][Ii].*" }
      { node.name = "~.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][._ -]?[Pp][Oo][Rr][Tt].*" }
      { node.description = "~.*[Hh][Dd][Mm][Ii].*" }
      { node.description = "~.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][._ -]?[Pp][Oo][Rr][Tt].*" }
      { node.name = "~alsa_output[.]pci-0000_00_1f[.]3-platform-skl_hda_dsp_generic[.].*" }
    ]
    actions.update-props = { node.disabled = false }
  }
  {
    matches = [
      { node.name = "~alsa_output[.]pci-0000_00_1f[.]3-platform-skl_hda_dsp_generic[.]HiFi__Speaker__sink" }
    ]
    actions.update-props = { priority.session = 1100 }
  }
  {
    matches = [
      { node.name = "~alsa_output[.]pci-0000_00_1f[.]3-platform-skl_hda_dsp_generic[.]HiFi__Headphones__sink" }
    ]
    actions.update-props = { priority.session = 1200 }
  }
]
