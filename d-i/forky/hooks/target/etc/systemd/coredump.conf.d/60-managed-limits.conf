# Managed by unattended-installer; sizes are explicit host-profile policy.
# Retention thresholds are not a strict peak allocation/concurrency limit.
# Larger cores may have no stack trace or retained dump; size for the host.
[Coredump]
Storage=__SYSTEMD_COREDUMP_STORAGE__
Compress=yes
ProcessSizeMax=__SYSTEMD_COREDUMP_PROCESS_SIZE_MAX__
ExternalSizeMax=__SYSTEMD_COREDUMP_EXTERNAL_SIZE_MAX__
MaxUse=__SYSTEMD_COREDUMP_MAX_USE__
KeepFree=__SYSTEMD_COREDUMP_KEEP_FREE__
