# Managed persistent journal policy.
#
# systemd-journald owns structured userspace and service logs and forwards
# classic syslog records to rsyslog. rsyslog's imklog input owns kernel
# messages so high-volume nftables records are classified and stopped before
# they can consume journal storage. The managed security class also masks
# systemd-journald-audit.socket so auditd remains the sole audit-netlink owner;
# rsyslog tails auditd's file only for the dedicated AppArmor view.

[Journal]
Storage=persistent
Compress=yes
Seal=yes
SplitMode=uid
SyncIntervalSec=5m

RateLimitIntervalSec=30s
RateLimitBurst=10000

SystemMaxUse=__SYSTEMD_JOURNAL_SYSTEM_MAX_USE__
SystemKeepFree=__SYSTEMD_JOURNAL_SYSTEM_KEEP_FREE__
SystemMaxFileSize=__SYSTEMD_JOURNAL_SYSTEM_MAX_FILE_SIZE__
SystemMaxFiles=__SYSTEMD_JOURNAL_SYSTEM_MAX_FILES__
RuntimeMaxUse=__SYSTEMD_JOURNAL_RUNTIME_MAX_USE__
RuntimeKeepFree=__SYSTEMD_JOURNAL_RUNTIME_KEEP_FREE__
RuntimeMaxFileSize=__SYSTEMD_JOURNAL_RUNTIME_MAX_FILE_SIZE__
RuntimeMaxFiles=__SYSTEMD_JOURNAL_RUNTIME_MAX_FILES__
MaxRetentionSec=1month
MaxFileSec=1week

ForwardToSyslog=yes
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=yes
MaxLevelStore=debug
MaxLevelSyslog=debug
MaxLevelKMsg=notice
MaxLevelConsole=info
MaxLevelWall=emerg
ReadKMsg=no
