# Managed by installer automation.
#
# Keep the D-Bus service enabled for NetworkManager and desktop clients, but do
# not start a dedicated P2P device interface. The -c policy applies to interfaces
# loaded from that file; NetworkManager creates its own via D-Bus. Its unmanaged
# wifi-p2p policy prevents activation, not discovery of a P2P-capable device.

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -u -s -c /etc/wpa_supplicant/wpa_supplicant.conf -O "DIR=/run/wpa_supplicant GROUP=netdev"

# System-manager service: keep host radio/driver access, but remove unrelated
# privilege. Do not use PrivateNetwork/PrivateDevices: nl80211, EAPOL and rfkill
# must reach the physical adapter. Read-only homes still permit user EAP certs.
NoNewPrivileges=yes
# CAP_CHOWN is required for the explicit GROUP=netdev control socket.
# CAP_DAC_READ_SEARCH preserves EAP certificate/key reads from private homes;
# do not retain CAP_DAC_OVERRIDE, which would also bypass write permissions.
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_READ_SEARCH CAP_NET_ADMIN CAP_NET_RAW
AmbientCapabilities=
ProtectSystem=full
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelTunables=yes
# nl80211 sets per-interface unicast/multicast and unsolicited ARP/NA filters.
# Interfaces can be created after startup: an existing-file exception would
# miss hotplug/renames. Keep all other kernel tunables read-only, and retain the
# capability bound above (in particular, no CAP_SYS_ADMIN or CAP_DAC_OVERRIDE).
ReadWritePaths=/proc/sys/net/ipv4/conf -/proc/sys/net/ipv6/conf
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_PACKET AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
LimitCORE=0
UMask=0077
KillMode=control-group
TimeoutStopSec=15s
