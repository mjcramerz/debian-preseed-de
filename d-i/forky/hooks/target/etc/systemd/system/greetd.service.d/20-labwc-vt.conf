[Unit]
Conflicts=getty@tty1.service
# Start the reserved emergency console explicitly, including when the greeter
# or desktop fails before logind's automatic VT activation can provide it.
Wants=systemd-user-sessions.service systemd-logind.service seatd.service dbus.socket getty@tty6.service
After=systemd-user-sessions.service systemd-logind.service seatd.service dbus.socket getty@tty6.service

[Service]
TTYPath=/dev/tty1
StandardInput=tty
SyslogIdentifier=greetd-labwc
StandardOutput=journal
StandardError=journal
