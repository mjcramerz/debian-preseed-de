[Unit]
StartLimitIntervalSec=120s
StartLimitBurst=3

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
TimeoutStopSec=30s
KillMode=control-group
Restart=on-failure
RestartSec=5s
