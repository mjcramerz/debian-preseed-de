[Unit]
Wants=network-pre.target
Before=network-pre.target
After=systemd-sysctl.service

[Service]
# Stop removes only the tables owned by this installer. The generator already
# uses idempotent destroy on start; leave CrowdSec and other owners untouched.
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet labwc_filter
ExecStop=/usr/sbin/nft destroy table ip labwc_nat
ExecStartPre=
ExecStartPre=/usr/sbin/nft -c -f /etc/nftables.conf
ExecReload=
ExecReload=/usr/sbin/nft -c -f /etc/nftables.conf
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
TimeoutStartSec=30s
TimeoutStopSec=30s
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
