[Unit]
# Bind the numeric loopback listener before resolved accepts early host queries.
# Debian's network-online ordering would make resolved -> Stubby -> network
# readiness -> resolved a cycle. Upstream connections can wait for connectivity.
DefaultDependencies=no
Wants=
After=
Requires=apparmor.service
After=local-fs.target systemd-sysusers.service apparmor.service
Before=sysinit.target systemd-resolved.service shutdown.target
Conflicts=shutdown.target

[Service]
# Debian's packaged unit already owns the DynamicUser and readiness protocol.
# The application DNS listener is unprivileged and needs no capabilities.
AppArmorProfile=app-veth-dns-tls
# Keep dependent DNS/veth services active during a transient automatic restart.
RestartMode=direct
AmbientCapabilities=
CapabilityBoundingSet=
CacheDirectory=stubby
CacheDirectoryMode=0700
UMask=0077
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
TasksMax=16
MemoryMax=64M
LimitNOFILE=256
