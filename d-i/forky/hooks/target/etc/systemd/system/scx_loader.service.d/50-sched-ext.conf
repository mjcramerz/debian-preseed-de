# Avoid attempting sched_ext activation on kernels without the required sysfs
# feature. The package-provided loader is the managed boot backend.
[Unit]
ConditionPathExists=/sys/kernel/sched_ext
After=systemd-modules-load.service
# scx_loader.service and scx.service are alternative scheduler backends. The
# direct backend owns the one-way ordering edge; repeating the reverse edge
# here creates a stop transaction cycle in systemd.
Conflicts=scx.service
