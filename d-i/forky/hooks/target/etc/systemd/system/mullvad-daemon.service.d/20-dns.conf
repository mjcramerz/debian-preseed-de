[Unit]
# The managed cache lives on persistent local storage and is created by
# systemd-tmpfiles before Mullvad attempts its first version-cache read.
Requires=systemd-resolved.service systemd-tmpfiles-setup.service
After=local-fs.target systemd-resolved.service systemd-tmpfiles-setup.service
RequiresMountsFor=/var/lib/mullvad-version-cache

[Service]
ExecStartPre=/usr/local/libexec/mullvad-tailscale-coordinator mullvad-start
ExecStopPost=/usr/local/libexec/mullvad-tailscale-coordinator mullvad-stop
Environment=TALPID_DNS_MODULE=systemd
# /var/cache is tmpfs-backed on the managed desktop. Point Mullvad at a
# systemd-managed persistent cache root instead of bind-mounting over the
# package's default cache path.
Environment=MULLVAD_CACHE_DIR=/var/lib/mullvad-version-cache
StateDirectory=mullvad-version-cache
StateDirectoryMode=0755
