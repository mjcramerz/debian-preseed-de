# Avoid attempting sched_ext activation on kernels without the required sysfs
# feature. The package-provided service remains available for manual control.
[Unit]
ConditionPathExists=/sys/kernel/sched_ext
After=systemd-modules-load.service
# scx.service and scx_loader.service are alternative scheduler backends. Keep
# a manual direct start from racing the profile-selected D-Bus loader.
Conflicts=scx_loader.service
Before=scx_loader.service
