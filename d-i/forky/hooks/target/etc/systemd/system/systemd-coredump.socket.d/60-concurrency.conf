# Managed by unattended-installer.
# Cap simultaneous socket-activated workers and temporarily slow crash storms.
# Excess concurrent dumps can be refused. This is not a retention/byte limit.
# Preserve the vendor trigger-limit fuse; do not replace it with a tight fatal
# rate limit. Poll throttling automatically recovers when its window expires.
# No per-source cap: AF_UNIX source means helper UID, not crashed process UID.
[Socket]
MaxConnections=__SYSTEMD_COREDUMP_MAX_CONNECTIONS__
PollLimitIntervalSec=__SYSTEMD_COREDUMP_POLL_LIMIT_INTERVAL_SEC__s
PollLimitBurst=__SYSTEMD_COREDUMP_POLL_LIMIT_BURST__
