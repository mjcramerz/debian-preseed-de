[Unit]
After=nftables.service systemd-tmpfiles-setup.service
PartOf=nftables.service
ReloadPropagatedFrom=nftables.service

[Service]
ExecStartPre=/usr/bin/fail2ban-client -t
ExecReload=
ExecReload=/usr/bin/fail2ban-client reload --restart --all
TimeoutStartSec=30s
TimeoutStopSec=30s
UMask=0027
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
