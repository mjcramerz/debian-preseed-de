[Unit]
Requisite=labwc-session.target
Requires=labwc-gvfs-volume-monitor.service
Wants=gvfs-daemon.service
After=labwc-session.target gvfs-daemon.service labwc-gvfs-volume-monitor.service
PartOf=labwc-session.target
ConditionEnvironment=LABWC_SESSION_OWNER=desktop
ConditionEnvironment=WAYLAND_DISPLAY
ConditionEnvironment=XDG_SESSION_TYPE=wayland
ConditionPathExists=!/run/user/%U/labwc-session-closing
StartLimitIntervalSec=30s
StartLimitBurst=3

[Service]
# D-Bus activation and desktop launchers must use the same primary instance.
Type=dbus
BusName=org.xfce.FileManager
ExecStart=
ExecStart=/usr/bin/Thunar --daemon
Environment=LABWC_SESSION_APP=1 GDK_BACKEND=wayland GDK_DEBUG=nogl GIO_USE_VFS=gvfs GIO_USE_VOLUME_MONITOR=GProxyVolumeMonitorLabwc
UnsetEnvironment=DISPLAY XAUTHORITY GTK_THEME LD_PRELOAD LD_AUDIT LD_LIBRARY_PATH
AppArmorProfile=desktop-launcher
Slice=app.slice
PrivateUsers=no
PrivateMounts=no
PrivateTmp=no
PrivateIPC=no
NoNewPrivileges=no
UMask=0077
LimitCORE=0
KillMode=control-group
TimeoutStartSec=15s
TimeoutStopSec=20s
SendSIGKILL=yes
Restart=on-failure
RestartSec=2s
StandardOutput=journal
StandardError=journal
SyslogIdentifier=labwc-thunar
