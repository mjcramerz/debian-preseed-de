[Unit]
Requisite=labwc-session.target
After=labwc-compositor.service labwc-session.target
ConditionEnvironment=LABWC_SESSION_OWNER=desktop
ConditionEnvironment=WAYLAND_DISPLAY
ConditionEnvironment=XDG_SESSION_TYPE=wayland
PartOf=labwc-session.target
StartLimitIntervalSec=30s
StartLimitBurst=5

[Service]
# Preserve the packaged agent and the service main PID; reject incompatible builds.
ExecStart=
ExecStart=/usr/local/libexec/labwc-hyprpolkit-agent --exec
RestartPreventExitStatus=78
UMask=0077
KillMode=control-group
ExecCondition=/usr/local/libexec/labwc-session-check session-ready
# This is Qt Quick software rendering, not QSG_RHI_BACKEND=software.
# Scope it to the small authentication dialog, not the compositor or other apps.
Environment=QT_QPA_PLATFORM=wayland
Environment=QT_QUICK_BACKEND=software
UnsetEnvironment=DISPLAY XAUTHORITY QSG_RHI_BACKEND QMLSCENE_DEVICE
Environment=QT_QUICK_CONTROLS_STYLE=Material
Environment=QT_QUICK_CONTROLS_MATERIAL_THEME=Dark
Environment=QT_NO_XDG_DESKTOP_PORTAL=1
Restart=on-failure
RestartSec=2s
TimeoutStopSec=10s

[Install]
WantedBy=labwc-session.target
