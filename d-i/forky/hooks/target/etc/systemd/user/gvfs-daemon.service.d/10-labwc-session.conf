[Unit]
Requisite=labwc-session.target
After=labwc-compositor.service labwc-session.target
ConditionEnvironment=LABWC_SESSION_OWNER=desktop
ConditionEnvironment=WAYLAND_DISPLAY
ConditionEnvironment=XDG_SESSION_TYPE=wayland
PartOf=labwc-session.target

[Service]
# Keep the mount/session backend alive while app.slice stops before drive removal.
Slice=session.slice
# Signal the FUSE child too, and let its unmount helpers finish during the
# grace period. mixed escalates as soon as gvfsd exits, interrupting cleanup.
KillMode=control-group
TimeoutStopSec=15s
