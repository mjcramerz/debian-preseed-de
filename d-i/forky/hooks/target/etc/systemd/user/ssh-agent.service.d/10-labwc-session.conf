[Unit]
ConditionEnvironment=LABWC_SESSION_OWNER=desktop
PartOf=labwc-session.target
Requisite=labwc-session.target
BindsTo=labwc-compositor.service
After=labwc-session.target

[Service]
# Socket activation and same-user clients retain the host credential/PID view.
PrivatePIDs=no
PrivateUsers=no
KillMode=control-group
TimeoutStopSec=10s
LimitCORE=0
