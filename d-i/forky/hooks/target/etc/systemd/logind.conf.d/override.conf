# Managed by unattended-installer.
#
# Keep login-session cleanup deterministic without changing the separately
# managed power-key, lid-switch, suspend, or idle-action behavior.
[Login]
# Preserve an emergency text-console login path.
NAutoVTs=6
ReserveVT=6

# Apply logout cleanup to every user. Empty values clear any lower-priority
# inclusion or exclusion lists, including systemd's default root exclusion.
KillUserProcesses=yes
KillOnlyUsers=
KillExcludeUsers=

# Retain the per-user manager briefly for rapid re-login, then remove IPC
# objects after the final non-system-user session exits.
UserStopDelaySec=10s
RemoveIPC=yes
