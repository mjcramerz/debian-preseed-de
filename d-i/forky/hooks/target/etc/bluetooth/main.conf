# Managed by unattended-installer.
#
# Keep the stable BlueZ D-Bus interfaces available to bluetoothctl,
# WirePlumber, and desktop applications. BlueZ owns controller policy; the
# optional bounded controller initializer runs only after bluetoothd starts.

[General]
ControllerMode = dual
FastConnectable = false
Privacy = device
SecureConnections = on
Experimental = false
# KernelExperimental is intentionally omitted. BlueZ defaults it to disabled,
# and BlueZ 5.85 can misparse an explicit false value as an experimental UUID.

[Policy]
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64
AutoEnable=true
ResumeDelay=2
