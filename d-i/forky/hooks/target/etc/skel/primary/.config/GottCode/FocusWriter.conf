; Managed fresh-install defaults, using keys read by upstream FocusWriter.
; This is a prose editor, not a full OOXML renderer. Open Word documents with
; Writer, or use "FocusWriter (import DOCX text copy)" for a separate text draft.
; ODT is a safer default for NEW drafts; never overwrite a complex Word original.
[Edit]
AlwaysCenter=false
BlockCursor=false
SmartDoubleQuotes=-1
SmartQuotes=true
SmartSingleQuotes=-1
SmoothFonts=true
TypewriterSounds=false

[Goal]
History=true
Minutes=30
StreakMinimum=100
Streaks=true
Type=1
Words=1000

[Save]
DefaultFormat=odt
RememberPositions=true
WriteBOM=false

[SceneList]
Divider=##

[Spelling]
HighlightMisspelled=true
IgnoreNumbers=true
IgnoreUppercase=true
; Language deliberately follows the installed locale/dictionary.

[Stats]
CharactersPerPage=1500
PageSizeType=2
ParagraphsPerPage=5
ShowCharacters=true
ShowPages=true
ShowParagraphs=true
ShowWords=true
WordcountType=0
WordsPerPage=250

[ThemeManager]
Size=@Size(900 600)
Theme=managed-word
ThemeDefault=false

[Toolbar]
Actions=New, Open, Save, |, Undo, Redo, |, Cut, Copy, Paste, |, Find, Replace, |, Themes
Style=2

[View]
AlwaysShowFooter=true
AlwaysShowHeader=true
AlwaysShowScrollbar=true

[Window]
FocusedText=0
Fullscreen=false
MenuIcons=true
