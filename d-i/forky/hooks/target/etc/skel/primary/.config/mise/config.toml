# Managed global Mise configuration for the primary desktop account.
#
# Node 26 is the managed fallback. A project-local mise.toml created with
# `mise use node@22`, `mise use node@24`, or `mise use node@26` has higher
# precedence, so selecting a project version never competes with a hard-coded
# Node bin directory in PATH. LLVM 24 and Bazelisk remain direct managed tools.

[tools]
node = "26"
