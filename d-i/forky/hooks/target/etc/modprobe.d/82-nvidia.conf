# Wayland KMS/fbdev and complete video-memory preservation across sleep.
# The late installer enables the vendor suspend/hibernate/resume units and
# checks disk-backed scratch storage before allowing preservation to run.
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/lib/nvidia-vram
