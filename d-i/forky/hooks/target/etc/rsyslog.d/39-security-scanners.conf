# Scanner output enters rsyslog through a dedicated Unix socket rather than
# /dev/log. The socket is bound to a private ruleset so unrecognized input
# cannot fall through to general system logs. Its protected parent directory
# is created before rsyslog starts.

ruleset(name="managed_security_scanner_input" queue.type="LinkedList") {
if ($programname == "managed-lynis-scan") then {
  set $.managed_security_routed = "on";
  action(
    name="managed_lynis_scan_log"
    type="omfile"
    file="/var/log/managed/lynis/scan.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}

if ($programname == "managed-rkhunter-scan") then {
  set $.managed_security_routed = "on";
  action(
