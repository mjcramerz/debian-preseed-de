input(
  type="imuxsock"
  Socket="/run/rsyslog/managed-security-scanners/scanner.sock"
  CreatePath="off"
  Ruleset="managed_security_scanner_input"
  FlowControl="off"
  RateLimit.Interval="60"
  RateLimit.Burst="4000"
  RateLimit.Severity="7"
)
