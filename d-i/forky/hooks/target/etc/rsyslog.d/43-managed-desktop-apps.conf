# Route bounded lifecycle and failure events emitted by labwc-managed-app.
if ($programname == "labwc-managed-app") then {
  set $.managed_security_routed = "on";
  action(
    name="managed_desktop_applications_log"
    type="omfile"
    file="/var/log/managed/desktop/applications.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
  stop
}
