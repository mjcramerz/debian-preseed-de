# Operational messages from the managed AppArmor mode reconciler are distinct
# from audit events so aa-logprof continues to consume only AppArmor records.

if ($programname == "apparmor-managed-modes") then {
  set $.managed_security_routed = "on";
  action(
    name="managed_apparmor_modes_log"
    type="omfile"
    file="/var/log/managed/apparmor/managed-modes.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}
