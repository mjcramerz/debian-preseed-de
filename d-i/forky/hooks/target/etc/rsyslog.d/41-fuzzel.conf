# Route managed Computer Management Fuzzel menu selections and action outcomes
# from the user session to protected, searchable logs. The writer normalizes
# and bounds every field before syslog receives it.

if ($programname == "labwc-fuzzel-menu") then {
  set $.managed_security_routed = "on";
  action(
    name="managed_fuzzel_menu_log"
    type="omfile"
    file="/var/log/managed/fuzzel/menu.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}

if ($programname == "labwc-fuzzel-action") then {
  set $.managed_security_routed = "on";
  action(
    name="managed_fuzzel_action_log"
    type="omfile"
    file="/var/log/managed/fuzzel/actions.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}
