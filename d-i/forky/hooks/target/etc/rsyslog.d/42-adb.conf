# Route bounded ADB application events, ADB-specific Fuzzel activity, user-unit
# output, and systemd lifecycle diagnostics to one protected managed log.

if (
  $programname == "labwc-adb"
  or (
    (
      $programname == "labwc-fuzzel-menu"
      or $programname == "labwc-fuzzel-action"
    )
    and $msg contains "source=android-debug-bridge"
  )
  or (
    $programname == "systemd"
    and $msg contains "labwc-adb-server.service"
  )
) then {
  set $.managed_security_routed = "on";
  action(
    name="managed_adb_log"
    type="omfile"
    file="/var/log/managed/adb/adb.log"
    fileOwner="root"
    fileGroup="adm"
    fileCreateMode="0640"
    dirOwner="root"
    dirGroup="adm"
    dirCreateMode="0750"
    createDirs="on"
    template="RSYSLOG_TraditionalFileFormat"
  )
}
