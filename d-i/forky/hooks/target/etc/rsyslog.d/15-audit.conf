# auditd writes the authoritative audit log directly. Native audisp-syslog
# sends live AppArmor events for its parser/notification consumer; no file tail.
if ($inputname == "imuxsock" and
    ($!exe == "/usr/sbin/audisp-syslog" or $!exe == "/sbin/audisp-syslog") and
    $!uid == "0") then {
  set $.managed_audit_dispatch = "on";
  if (not ($msg contains "apparmor=" or $msg contains "type=1400" or $msg contains "type=APPARMOR")) then {
    stop
  }
}
