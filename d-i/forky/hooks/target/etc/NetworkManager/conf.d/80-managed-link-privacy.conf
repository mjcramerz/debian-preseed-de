# Managed by installer automation.
#
# Enforce link-layer privacy across both Ethernet and Wi-Fi. Wi-Fi scans use
# randomized MAC addresses and activated connections receive a fresh randomized
# MAC address for every association so the device does not present a stable
# hardware identifier before or during normal network use.

[device]
wifi.scan-rand-mac-address=yes

[device-wifi-p2p]
match-device=type:wifi-p2p
managed=0

[connection]
ethernet.cloned-mac-address=random
wifi.cloned-mac-address=random
