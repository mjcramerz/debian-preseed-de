# Pre-create the rsyslog audit-file correlation destination for every security class.
# Other accounts receive search-only traversal so separately group-scoped managed
# log directories can be used as exact Bubblewrap bind sources without exposing
# directory listings or protected log contents.
d /var/log/managed 0751 root adm -
d /var/log/managed/audit 0750 root adm -
f /var/log/managed/audit/kernel-audit.log 0640 root adm -
