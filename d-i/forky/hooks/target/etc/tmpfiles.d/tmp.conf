# Override Debian's vendor tmp.conf with the managed temporary-directory policy.
D! /tmp 1777 root root 0
e /tmp 1777 root root 7d
# wlroots accepts the shared X11 socket directory only when it is owned by
# root or by the compositor account. Pre-create the conventional root-owned
# directory after the boot-time /tmp cleanup and before user sessions start.
d /tmp/.X11-unix 1777 root root -
d /var/tmp 1777 root root 30d
