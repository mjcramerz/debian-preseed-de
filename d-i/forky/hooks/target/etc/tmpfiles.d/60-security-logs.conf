# Pre-create desktop-specific managed security log destinations before rsyslog starts.
d /var/log/managed/auth 0750 root adm -
f /var/log/managed/auth/auth.log 0640 root adm -
L /var/log/auth.log - - - - /var/log/managed/auth/auth.log
d /var/log/managed/hardware 0750 root adm -
f /var/log/managed/hardware/usb.log 0640 root adm -
d /var/log/managed/apparmor 0750 root adm -
f /var/log/managed/apparmor/apparmor.log 0640 root adm -
f /var/log/managed/apparmor/managed-modes.log 0640 root adm -
d /var/log/managed/storage 0750 root adm -
f /var/log/managed/storage/storage.log 0640 root adm -
d /var/log/managed/nftables 0750 root adm -
f /var/log/managed/nftables/firewall.log 0640 root adm -
d /var/log/managed/whisper 0750 root adm -
f /var/log/managed/whisper/whisper.log 0640 root adm -
d /var/log/managed/adb 0750 root adm -
f /var/log/managed/adb/adb.log 0640 root adm -
d /var/log/managed/fuzzel 0750 root adm -
f /var/log/managed/fuzzel/menu.log 0640 root adm -
f /var/log/managed/fuzzel/actions.log 0640 root adm -
d /var/log/managed/desktop 0750 root adm -
f /var/log/managed/desktop/applications.log 0640 root adm -
d /var/log/managed/lynis 0750 root adm -
f /var/log/managed/lynis/scan.log 0640 root adm -
f /var/log/managed/lynis/lynis.log 0640 root adm -
f /var/log/managed/lynis/lynis-report.dat 0640 root adm -
d /var/log/managed/rkhunter 0750 root adm -
f /var/log/managed/rkhunter/scan.log 0640 root adm -
f /var/log/managed/rkhunter/rkhunter.log 0640 root adm -
d /var/log/managed/chkrootkit 0750 root adm -
f /var/log/managed/chkrootkit/scan.log 0640 root adm -
d /var/log/managed/debsecan 0750 root adm -
f /var/log/managed/debsecan/scan.log 0640 root adm -
d /var/log/managed/debsums 0750 root adm -
f /var/log/managed/debsums/scan.log 0640 root adm -
d /var/log/managed/spectre-meltdown-checker 0750 root adm -
f /var/log/managed/spectre-meltdown-checker/scan.log 0640 root adm -
d /var/log/managed/fwupd 0750 root adm -
f /var/log/managed/fwupd/security-scan.log 0640 root adm -
d /var/log/managed/clamav 0750 root adm -
f /var/log/managed/clamav/scan.log 0640 root adm -
d /run/rsyslog/managed-security-scanners 0750 root securitylogger -

# Sanitized category-only signals wake the Labwc/Mako session through a
# dedicated signal-reader group without granting access to the real logs.
d /var/lib/labwc-notifications 0755 root root -
d /var/lib/labwc-notifications/security 0750 root logreader -
d /var/lib/labwc-notifications/system 2750 root logreader -
f /var/lib/labwc-notifications/security/auth.signal 0640 root logreader -
f /var/lib/labwc-notifications/security/usb.signal 0640 root logreader -
f /var/lib/labwc-notifications/security/storage.signal 0640 root logreader -
f /var/lib/labwc-notifications/security/apparmor.signal 0640 root logreader -
f /var/lib/labwc-notifications/security/firewall.signal 0640 root logreader -

# Non-active aa-easyprof drafts are reviewable but never loaded automatically.
d /var/lib/apparmor/easyprof 0755 root root -
d /var/lib/apparmor/drafts 0755 root root -
d /var/lib/apparmor/backup 0700 root root -
d /var/lib/apparmor/generated-rule-backups 0700 root root -
