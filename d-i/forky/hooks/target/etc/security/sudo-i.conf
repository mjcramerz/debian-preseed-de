# sudo -i remains in its invoking login/session cgroup. It is not a new
# interactive root login, and must not create /run/user/0 or a root user bus.
# Scope this to sudo-i; real root TTY/SSH logins retain normal logind tracking.
# Authentication, accounting, limits and the rest of common-session still run.
XDG_SESSION_CLASS DEFAULT=none OVERRIDE=none
