# LUKS2 root/home encryption with installer-time TPM2 bootstrap sealing and
# deferred TPM2+PIN plus recovery-passphrase enrollment.
d-i anna/choose_modules multiselect crypto-dm-modules
d-i anna/choose_modules seen true
d-i pkgsel/include string cryptsetup-initramfs systemd-cryptsetup systemd-tpm tpm2-tools tpm-udev mokutil
d-i pkgsel/include seen true
