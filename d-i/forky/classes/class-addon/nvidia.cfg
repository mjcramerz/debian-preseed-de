# Opt-in NVIDIA graphics baseline. This fragment is applied only when
# addon/nvidia is selected and an NVIDIA PCI display adapter is detected.
# Hybrid systems still use auto-detected integrated GPU classes. Keep the
# NVIDIA OpenGL/GLX and EGL Wayland userspace plus the Vulkan loader ABI needed
# by package dependencies. Managed launchers do not select a Vulkan backend.
d-i pkgsel/include string firmware-misc-nonfree libvulkan1 nvidia-dkms-595 nvidia-kernel-common-595 nvidia-utils-595 libgl1 libegl1 libgles2 libnvidia-gl-595 libnvidia-compute-595 nvidia-compute-utils-595 nvidia-vaapi-driver libnvidia-egl-wayland1 libnvidia-common-595 nvidia-firmware-595-595.84 libnvidia-encode-595 libnvidia-decode-595 libnvidia-extra-595 nvidia-kernel-source-595 libelf-dev clang lld llvm
d-i pkgsel/include seen true
