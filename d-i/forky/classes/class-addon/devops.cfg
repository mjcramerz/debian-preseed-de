# Desktop development toolchain. The class owns the active Mise and Cloudflare
# APT sources. The class-gated late helper installs verified upstream Deno,
# yt-dlp with bundled yt-dlp-ejs, the Ansible CLI from Ansible Core, OpenTofu,
# Terraform, Packer,
# Wrangler, Aptly, osc, and obs-build releases into isolated /usr/local/lib
# roots instead of installing their Debian packages. Debian ffmpeg/ffprobe
# provide the media merge and post-processing backend for yt-dlp.
# OpenTofu, HashiCorp, and Aptly repository examples stay commented for
# operator reference only.
d-i apt-setup/local22/repository string https://mise.jdx.dev/deb stable main
d-i apt-setup/local22/comment string mise upstream APT archive
d-i apt-setup/local22/key string https://mise.jdx.dev/gpg-key.pub
d-i apt-setup/local22/source boolean false

d-i apt-setup/local23/repository string https://pkg.cloudflare.com/cloudflared any main
d-i apt-setup/local23/comment string Cloudflare cloudflared APT archive
d-i apt-setup/local23/key string https://pkg.cloudflare.com/cloudflare-main.gpg
d-i apt-setup/local23/source boolean false

# OpenTofu APT repository (disabled). Official instructions also require the
# OpenTofu release key from https://get.opentofu.org/opentofu.gpg before use.
# d-i apt-setup/local24/repository string https://packages.opentofu.org/opentofu/tofu/any/ any main
# d-i apt-setup/local24/comment string OpenTofu upstream APT archive (disabled)
# d-i apt-setup/local24/key string https://packages.opentofu.org/opentofu/tofu/gpgkey
# d-i apt-setup/local24/source boolean false

# HashiCorp Terraform/Packer APT repository (disabled; direct archives are used).
# HashiCorp does not publish a Forky suite, so keep the supported Trixie suite.
# d-i apt-setup/local25/repository string https://apt.releases.hashicorp.com trixie main
# d-i apt-setup/local25/comment string HashiCorp Terraform and Packer APT archive (disabled)
# d-i apt-setup/local25/key string https://apt.releases.hashicorp.com/gpg
# d-i apt-setup/local25/source boolean false

# Aptly release repository (disabled; upstream binaries are installed directly).
# Upstream currently publishes this APT transport over HTTP; Release metadata is
# authenticated with the Aptly signing key below.
# d-i apt-setup/local26/repository string http://repo.aptly.info/release trixie main
# d-i apt-setup/local26/comment string Aptly release APT archive (disabled)
# d-i apt-setup/local26/key string https://www.aptly.info/pubkey.txt
# d-i apt-setup/local26/source boolean false

# Aptly CI/testing builds from the upstream master branch (disabled).
# d-i apt-setup/local27/repository string http://repo.aptly.info/ci trixie main
# d-i apt-setup/local27/comment string Aptly CI build APT archive (disabled)
# d-i apt-setup/local27/key string https://www.aptly.info/pubkey.txt
# d-i apt-setup/local27/source boolean false

d-i pkgsel/include string mise just sccache build-essential gcc g++ gcc-14 g++-14 pkg-config libssl-dev libcap-dev libopenblas-dev make cmake ninja-build curl wget xz-utils ffmpeg clang-24 llvm-24 lld-24 lldb-24 mold cppcheck shellcheck yamllint yq jq jsonschema-jv markdownlint gitlint ripgrep fd-find bat direnv e2fsprogs bubblewrap slirp4netns hyperfine python3 python3-argcomplete python3-cryptography python3-jinja2 python3-keyring python3-packaging python3-resolvelib python3-rpm python3-ruamel.yaml python3-secretstorage python3-urllib3 python3-yaml rpm rpm2cpio libarchive-tools libwww-perl libxml-parser-perl devscripts debhelper debmake dpkg-dev lintian quilt sbuild mmdebstrap
d-i pkgsel/include seen true
