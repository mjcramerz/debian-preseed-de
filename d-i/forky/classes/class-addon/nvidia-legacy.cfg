# Opt-in Pascal-capable NVIDIA graphics baseline. This fragment is applied only
# when addon/nvidia-legacy is selected and an NVIDIA PCI display adapter is
# detected. Hybrid systems still use auto-detected integrated GPU classes.
# The legacy branch must stay on the managed XanMod kernel path. Keep the
# 580-series driver/userspace stack and add the extra build helpers the DKMS
# repair path needs when newer XanMod kernels remove older GPIO headers. Keep
# the OpenGL/GLX and EGL Wayland userspace plus the Vulkan loader ABI needed by
# package dependencies. Managed launchers do not select a Vulkan backend.
d-i pkgsel/include string firmware-misc-nonfree libvulkan1 pahole nvidia-dkms-580 nvidia-kernel-common-580 nvidia-utils-580 libgl1 libegl1 libgles2 libnvidia-gl-580 libnvidia-compute-580 nvidia-compute-utils-580 nvidia-vaapi-driver libnvidia-egl-wayland1 libnvidia-common-580 nvidia-firmware-580-580.142 libnvidia-encode-580 libnvidia-decode-580 libnvidia-extra-580 nvidia-kernel-source-580 libelf-dev clang lld llvm
d-i pkgsel/include seen true
