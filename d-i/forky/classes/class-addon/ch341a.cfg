# Firmware extraction, CH341A/CH347 programming, kernel SPI, and UART baseline.
# Debian Forky currently exposes cramfsswap instead of a cramfsprogs package in
# the configured archives, so the add-on uses the available cramfs utility.
# SNANDer is installed separately by the class late helper from a checksum-pinned
# upstream source archive because Debian does not currently package it.
d-i pkgsel/include string flashrom flashprog imsprog binwalk python3-binwalk uefitool uefitool-cli coreboot-utils mtd-utils spi-tools usbutils kmod picocom minicom screen python3-serial squashfs-tools cramfsswap lz4 cabextract cpio 7zip unar xz-utils zstd file binutils bsdextrautils xxd hexedit python3-magic okteta curl ca-certificates
d-i pkgsel/include seen true
