# NVIDIA CUDA 13.1 compiler and userspace stack for development and other CUDA
# consumers. Keep nvcc, CUDART headers, and the cuBLAS development ABI aligned;
# AI release installation does not remove or invoke this compiler toolchain.
d-i pkgsel/include string cuda-cudart-13-1 cuda-cudart-dev-13-1 cuda-nvcc-13-1 cuda-nvrtc-13-1 cuda-opencl-13-1 libcublas-13-1 libcublas-dev-13-1 libcufft-13-1 libcufile-13-1 libcuobjclient-13-1 libcurand-13-1 libcusolver-13-1 libcusparse-13-1 libnpp-13-1 libnvjitlink-13-1 libnvfatbin-13-1 libnvjpeg-13-1 libnccl2
d-i pkgsel/include seen true

### NVIDIA CUDA upstream network APT repo for Debian 13 amd64.
d-i apt-setup/local13/repository string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/ /
d-i apt-setup/local13/comment string NVIDIA CUDA Archive
d-i apt-setup/local13/key string https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub
d-i apt-setup/local13/source boolean false
