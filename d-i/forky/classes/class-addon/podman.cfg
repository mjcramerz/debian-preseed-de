# One locked devops rootless engine; Docker CLI/Compose use its Unix API.
# No docker.io daemon, podman-docker rootful socket alias, or privileged bridge.
d-i pkgsel/include string podman docker-cli docker-compose golang-github-containers-common conmon crun uidmap netavark aardvark-dns catatonit python3 iproute2 nftables util-linux systemd-resolved
d-i pkgsel/include seen true
