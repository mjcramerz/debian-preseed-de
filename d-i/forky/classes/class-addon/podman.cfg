# One locked devops rootless engine; Docker CLI/Compose use its Unix API.
# No docker.io daemon, podman-docker rootful socket alias, or privileged bridge.
d-i pkgsel/include string podman docker-cli docker-compose golang-github-containers-common conmon crun uidmap netavark aardvark-dns passt catatonit dbus-user-session python3
d-i pkgsel/include seen true
