# Desktop application archives and managed user-facing software bundle.
# systemd-resolved and mullvad-vpn are installed during late_command so the
# resolver ownership transition cannot disrupt the shared pkgsel transaction.
# The Mullvad VPN artifact is detached-signature verified before target APT
# installs it, and installer DNS is seeded into the target resolver stub after
# both package transitions.
d-i pkgsel/include string code microsoft-edge-stable vivaldi-stable powershell mullvad-browser qbittorrent telegram-desktop gh/trixie glab sqlfluff sqlitebrowser sqlite3 sqlite3-tools usql duckdb mariadb-client postgresql-client default-mysql-client mysql-shell redis-tools valkey-tools make build-essential devscripts debhelper debmake dpkg-dev lintian quilt sbuild mmdebstrap spotify-client retroarch retroarch-assets openssl file brotli gpgv libxcb-xtest0 ibus
d-i pkgsel/include seen true

# Microsoft Visual Studio Code
d-i apt-setup/local4/repository string https://packages.microsoft.com/repos/code stable main
d-i apt-setup/local4/comment string Microsoft Visual Studio Code
d-i apt-setup/local4/key string https://packages.microsoft.com/keys/microsoft.asc
d-i apt-setup/local4/source boolean false

# Microsoft Edge
d-i apt-setup/local5/repository string https://packages.microsoft.com/repos/edge stable main
d-i apt-setup/local5/comment string Microsoft Edge
d-i apt-setup/local5/key string https://packages.microsoft.com/keys/microsoft.asc
d-i apt-setup/local5/source boolean false

# Microsoft PowerShell
d-i apt-setup/local6/repository string https://packages.microsoft.com/debian/13/prod trixie main
d-i apt-setup/local6/comment string Microsoft PowerShell (Debian 13 Trixie)
d-i apt-setup/local6/key string https://packages.microsoft.com/keys/microsoft-2025.asc
d-i apt-setup/local6/source boolean false

# Mullvad Browser and VPN
d-i apt-setup/local7/repository string https://repository.mullvad.net/deb/stable stable main
d-i apt-setup/local7/comment string Mullvad Browser and VPN Archive
d-i apt-setup/local7/key string https://repository.mullvad.net/deb/mullvad-keyring.asc
d-i apt-setup/local7/source boolean false

# Oracle MySQL Shell and client tooling. Oracle does not publish a Forky suite;
# use its current Debian 13 LTS archive while the base OS remains Debian Forky.
d-i apt-setup/local8/repository string https://repo.mysql.com/apt/debian trixie mysql-9.7-lts mysql-tools
d-i apt-setup/local8/comment string Oracle MySQL 9.7 LTS and Tools (Debian 13 Trixie)
d-i apt-setup/local8/key string https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
d-i apt-setup/local8/source boolean false

# Spotify
d-i apt-setup/local9/repository string https://repository.spotify.com stable non-free
d-i apt-setup/local9/comment string Spotify
d-i apt-setup/local9/key string https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
d-i apt-setup/local9/source boolean false

# Vivaldi Browser
d-i apt-setup/local10/repository string https://repo.vivaldi.com/archive/deb stable main
d-i apt-setup/local10/comment string Vivaldi Browser
d-i apt-setup/local10/key string https://repo.vivaldi.com/archive/linux_signing_key.pub
d-i apt-setup/local10/source boolean false
