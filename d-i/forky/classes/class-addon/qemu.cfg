# Direct QEMU/KVM and confined Incus baseline with managed /pool-backed
# target staging. Packages stay explicit so pkgsel does not pull in libvirt,
# Vagrant, classic LXC, or broader workstation stacks through recommends.
d-i pkgsel/include string qemu-system-x86 qemu-system-modules-opengl qemu-utils qemu-block-extra ovmf swtpm swtpm-tools virtiofsd passt incus incus-client incus-ui-canonical uidmap libosinfo-bin genisoimage
d-i pkgsel/include seen true

# Zabbly Incus Stable (Debian Trixie)
d-i apt-setup/local17/repository string https://pkgs.zabbly.com/incus/stable trixie main
d-i apt-setup/local17/comment string Zabbly Incus Stable (Debian Trixie)
d-i apt-setup/local17/key string https://pkgs.zabbly.com/key.asc
d-i apt-setup/local17/source boolean false
