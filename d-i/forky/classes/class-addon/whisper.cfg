# Profile-pinned AMD64 whisper.cpp runtime installation and PipeWire recording
# baseline. Python drives the bounded archive validator; the retained compiler,
# CMake, Ninja, sccache, and OpenBLAS development packages remain available for
# user development but are not used to compile Whisper during installation.
# These packages are installed only when classes includes addon/whisper.
d-i pkgsel/include string build-essential gcc g++ gcc-14 g++-14 cmake ninja-build git curl ca-certificates pkg-config pipewire-bin perl python3 sccache libopenblas-dev
d-i pkgsel/include seen true
