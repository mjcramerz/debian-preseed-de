# Intel UHD / Iris integrated graphics baseline.
# Keep the auto class limited to Intel-specific firmware, the media driver, and
# the Mesa OpenGL/EGL/GLES runtimes and Vulkan loader ABI needed by the desktop.
# Hybrid NVIDIA hosts must not auto-pull Intel compute stacks, but they do need
# the lightweight diagnostics used to confirm the desktop stays off llvmpipe.
d-i pkgsel/include string firmware-intel-graphics libvulkan1 intel-media-va-driver-non-free mesa-utils mesa-utils-extra libgl1 libegl1 libgles2 libgbm1 libdrm2 libgl1-mesa-dri
d-i pkgsel/include seen true
