# GitHub Actions runner registration is opt-in. The token is the only
# protected preseed value; URL, identity, labels, and archive URL are
# supplied as installer command-line/debconf answers.
d-i pkgsel/include string git git-lfs ca-certificates curl tar gzip podman podman-docker podman-compose uidmap slirp4netns fuse-overlayfs netavark aardvark-dns crun conmon
d-i pkgsel/include seen true
