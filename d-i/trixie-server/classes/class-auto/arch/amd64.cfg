# amd64 server EFI boot-chain defaults. The selected disk fragment owns the
# XanMod1 image/header pair: NVMe uses x64v3; VM and eMMC use x64v2.
d-i base-installer/kernel/linux/initrd boolean false
d-i base-installer/kernel/linux/initrd seen true
d-i base-installer/kernel/linux/initramfs-generators string initramfs-tools
d-i base-installer/kernel/linux/initramfs-generators seen true
d-i base-installer/kernel/linux/initramfs-tools/driver-policy string most
d-i base-installer/kernel/linux/initramfs-tools/driver-policy seen true
d-i base-installer/kernel/linux/initramfs-tools/compression string lz4
d-i base-installer/kernel/linux/initramfs-tools/compression seen true
d-i base-installer/kernel/linux/skip-install boolean true
d-i base-installer/kernel/linux/skip-install seen true
d-i base-installer/kernel/image select none
d-i base-installer/kernel/linux/extra-packages string dkms kmod sbsigntool
d-i pkgsel/include string grub-efi-amd64 grub-efi-amd64-signed shim-signed shim-helpers-amd64-signed initramfs-tools kmod python3 sbsigntool xz-utils fwupd fwupd-amd64-signed busybox
d-i pkgsel/include seen true
