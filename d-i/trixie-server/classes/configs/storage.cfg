Type: class
Group: disk
Name: nvme
Description: NVMe server storage
HostProfilePrefix: btrfs-srv
HostFamily: btrfs
HookFamily: btrfs
InstallDiskCandidates: /dev/nvme0n1, /dev/nvme*n*, /dev/sd*
DefaultInstallDisk: /dev/nvme0n1

Type: class
Group: disk
Name: emmc
Description: eMMC server storage
HostProfilePrefix: f2fs-srv
HostFamily: f2fs
HookFamily: f2fs
InstallDiskCandidates: /dev/mmcblk0, /dev/mmcblk*
DefaultInstallDisk: /dev/mmcblk0

Type: class
Group: disk
Name: vm
Description: virtual server storage
HostProfilePrefix: btrfs-srv
HostFamily: btrfs
HookFamily: btrfs
InstallDiskCandidates: /dev/vda, /dev/vd*, /dev/nvme*, /dev/sd*
DefaultInstallDisk: /dev/vda
