########## Bootloader and finish ##########
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/enable_os_prober_otheros_yes boolean false
d-i grub-installer/enable_os_prober_otheros_no boolean false
grub2 grub2/enable_os_prober boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/update-nvram boolean true
d-i grub-installer/skip boolean false
d-i finish-install/keep-consoles boolean false
d-i debian-installer/exit/reboot boolean true
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false
