########## Destructive, deterministic server storage ##########
d-i partman/default_filesystem string ext4
d-i partman/mount_style select uuid
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_new_label boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/alignment string optimal
d-i partman/choose_partition select finish
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select btrfs-srv-flex
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-efi/confirm boolean true
d-i partman-efi/non_efi_system boolean false

# The selected profile supplies the complete expert recipe in partman early
# processing. This keeps the profile's exact sizes and slot policy authoritative.
