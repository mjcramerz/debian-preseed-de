##########  Mirror / APT defaults  ##########
d-i debian-installer/allow_unauthenticated boolean false
d-i debian-installer/allow_unauthenticated_ssl boolean false
d-i mirror/country string manual
d-i mirror/protocol select https
d-i mirror/codename string trixie
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie
d-i mirror/https/countries select manual
d-i mirror/https/hostname string mirrors.glesys.net
d-i mirror/https/mirror select mirrors.glesys.net
d-i mirror/https/directory string /debian/
d-i mirror/https/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/no_mirror boolean false
d-i apt-setup/services-select multiselect security, updates, backports
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/backports boolean true

##########  Signed APT archives  ##########
d-i apt-setup/local0/repository string https://mirrors.glesys.net/debian forky main contrib non-free non-free-firmware
d-i apt-setup/local0/comment string Debian Forky compatibility packages
d-i apt-setup/local0/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local0/source boolean true

d-i apt-setup/local1/repository string https://mirrors.glesys.net/debian experimental main contrib non-free non-free-firmware
d-i apt-setup/local1/comment string Debian Experimental explicit opt-in packages
d-i apt-setup/local1/key string https://ftp-master.debian.org/keys/archive-key-13.asc
d-i apt-setup/local1/source boolean false

d-i apt-setup/local2/repository string https://deb.xanmod.org trixie main non-free
d-i apt-setup/local2/comment string XanMod signed kernel archive
d-i apt-setup/local2/key string https://dl.xanmod.org/archive.key
d-i apt-setup/local2/source boolean false

d-i apt-setup/local3/repository string https://packagecloud.io/crowdsec/crowdsec/any any main
d-i apt-setup/local3/comment string CrowdSec stable
d-i apt-setup/local3/key string https://packagecloud.io/crowdsec/crowdsec/gpgkey
d-i apt-setup/local3/source boolean false

##########  Package selection defaults  ##########
d-i base-installer/install-recommends boolean false
d-i base-installer/install-recommends seen true
d-i base-installer/excludes string dbus dbus-daemon
d-i base-installer/includes string initramfs-tools busybox openssl kmod gzip zstd
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/run_tasksel seen true
d-i pkgsel/install-recommends boolean false
d-i pkgsel/install-recommends seen true
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select unattended-upgrades
d-i pkgsel/include string btrfs-progs xfsprogs bolt dosfstools lz4 inotify-tools sudo ca-certificates bash-completion perl liblog-any-perl libmoo-perl libmoox-handlesvia-perl libmoox-log-any-perl libmoox-options-perl libmoox-strictconstructor-perl libmoox-types-mooselike-perl libmoox-types-mooselike-numeric-perl libmoox-typetiny-perl libtype-tiny-perl libtypes-path-tiny-perl gpg gnupg git wget curl unzip tar p7zip cryptsetup efibootmgr initramfs-tools busybox mokutil sbsigntool openssl kmod util-linux util-linux-extra usrmerge ifupdown network-manager wpasupplicant wireless-regdb ethtool xz-utils zstd nftables fail2ban rsyslog logrotate fonts-dejavu-core python3 python3-yaml dbus-broker dbus-user-session dbus-bin dbus-system-bus-common dbus-session-bus-common udisks2 unattended-upgrades tpm2-tools tpm-udev firmware-linux-free firmware-linux-nonfree firmware-misc-nonfree firmware-realtek firmware-iwlwifi firmware-atheros firmware-brcm80211 firmware-sof-signed whois openssh-server openssh-client
d-i pkgsel/include seen true
