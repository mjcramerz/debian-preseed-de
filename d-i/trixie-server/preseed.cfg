# Debian Trixie installer answers for the independent Debian 13 server
# profile. The server tree is intentionally separate from the Forky desktop
# generation and does not alter the existing desktop products.
d-i debconf/priority select critical
d-i debconf/priority seen true
d-i auto-install/classes string prod,server,standard,static,btrfs-srv-flex,addon/crowdsec,addon/codex

# Pass server_source=<HTTPS repository directory> on the installer command
# line. The include command fetches the source transport and complete payload,
# then emits local include files from /tmp/server-install.
d-i preseed/include_command string /bin/sh -c 'set -eu; umask 077; source_base=; for arg in $(cat /proc/cmdline); do case "$arg" in server_source=https://*) source_base=${arg#server_source=};; esac; done; [ -n "$source_base" ] || { echo "fatal: server_source=https://... is required" >&2; exit 1; }; source_tmp=$(mktemp /tmp/server-source.XXXXXX); trap "rm -f \"$source_tmp\"" EXIT HUP INT TERM; /usr/bin/wget --no-config -q --timeout=30 --tries=3 --max-redirect=3 -O "$source_tmp" "${source_base%/}/scripts/common/source.sh"; . "$source_tmp"; server_source_prepare_payload "$source_base" /tmp/server-install; /bin/sh /tmp/server-install/scripts/preseed/bootstrap.sh /tmp/server-install; for relative in common.cfg fragments/apt.cfg fragments/network.cfg fragments/partman.cfg fragments/finish.cfg; do include_file=/tmp/server-install/$relative; [ -f "$include_file" ] && [ ! -L "$include_file" ] || { echo "fatal: payload include is missing: $relative" >&2; exit 1; }; printf "file://%s\\n" "$include_file"; done'
d-i preseed/early_command string /bin/sh -c '/bin/sh /tmp/server-install/scripts/preseed/account-answers.sh /tmp/server-install; /bin/sh /tmp/server-install/scripts/preseed/class-answers.sh /tmp/server-install'
d-i partman/early_command string /bin/sh /tmp/server-install/scripts/partman/choose-layout.sh
d-i preseed/late_command string /bin/sh /tmp/server-install/scripts/late/dispatch.sh /tmp/server-install
