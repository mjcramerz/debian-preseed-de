# Managed by debian-preseed-de server provisioning.
Port @SSH_PORT@
AddressFamily any
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
UsePAM yes
AllowUsers @SSH_USER@
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
MaxSessions 8
LoginGraceTime 20
StrictModes yes
LogLevel VERBOSE
