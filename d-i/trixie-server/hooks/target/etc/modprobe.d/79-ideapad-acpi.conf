# Lenovo IdeaPad/Flex: retain firmware thermal management and kernel DMI quirks.
# The module accepts these booleans; fan_control and fan_mode are NOT module
# parameters. When supported by this specific firmware, fan_mode is exposed
# under /sys/bus/platform/drivers/ideapad_acpi/*/fan_mode. Do not force dust,
# silent or performance modes across different Flex generations.
options ideapad_laptop no_bt_rfkill=0 allow_v4_dytc=0

# Do not force hw_rfkill_switch, touchpad_ctrl_via_ec or i915 backlight methods:
# their safe values depend on DMI, panel and firmware and are selected by Linux.
