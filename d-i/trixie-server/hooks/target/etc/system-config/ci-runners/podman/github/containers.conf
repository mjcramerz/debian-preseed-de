[containers]
cgroupns = "private"
netns = "private"
utsns = "private"
pids_limit = 2048
log_driver = "k8s-file"
log_size_max = 16777216
env = [
  "BUILDBUDDY_REMOTE_CACHE=grpc://host.containers.internal:1985",
  "BAZELRC=/etc/system-config/ci-runners/github-container.bazelrc"
]
volumes = [
  "/pool/build/runners/github:/pool/build/runners/github",
  "/pool/cache/runners/github:/pool/cache/runners/github",
  "/pool/db/runners/github:/pool/db/runners/github",
  "/pool/podman/users/github-runner:/pool/podman/users/github-runner",
  "/etc/system-config/ci-runners/github-container.bazelrc:/etc/system-config/ci-runners/github-container.bazelrc:ro"
]

[engine]
cgroup_manager = "systemd"
events_logger = "journald"
runtime = "crun"
network_backend = "netavark"
runtime_tmpdir = "/pool/podman/runners/github/tmp"
image_copy_tmp_dir = "/pool/podman/runners/github/tmp"
static_dir = "/pool/podman/runners/github/libpod"
volume_path = "/pool/podman/runners/github/volumes"
network_config_dir = "/pool/podman/runners/github/networks"
network_cmd_options = ["allow_host_loopback=true"]

[network]
default_rootless_network_cmd = "slirp4netns"
