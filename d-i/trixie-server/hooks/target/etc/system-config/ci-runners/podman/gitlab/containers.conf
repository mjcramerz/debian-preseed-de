[containers]
cgroupns = "private"
netns = "private"
utsns = "private"
pids_limit = 2048
log_driver = "k8s-file"
log_size_max = 16777216
env = [
  "BUILDBUDDY_REMOTE_CACHE=grpc://host.containers.internal:1985",
  "BAZELRC=/etc/system-config/ci-runners/gitlab.bazelrc"
]

[engine]
cgroup_manager = "systemd"
events_logger = "journald"
runtime = "crun"
network_backend = "netavark"
runtime_tmpdir = "/pool/podman/runners/gitlab/tmp"
image_copy_tmp_dir = "/pool/podman/runners/gitlab/tmp"
static_dir = "/pool/podman/runners/gitlab/libpod"
volume_path = "/pool/podman/runners/gitlab/volumes"
network_config_dir = "/pool/podman/runners/gitlab/networks"
network_cmd_options = ["allow_host_loopback=true"]

[network]
default_rootless_network_cmd = "slirp4netns"
