# SYSTEMD_DEFAULT_IOACCOUNTING_ENABLE alone renders yes/no; weights are independent.
# Managed by unattended-installer.
# Defaults only: do not rewrite explicit accounting in existing units.
# CPU accounting is automatic on cgroup v2; no deprecated CPUAccounting option.
[Manager]
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
DefaultIOAccounting=no
